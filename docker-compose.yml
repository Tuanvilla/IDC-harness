# ============================================================================
# IDC Harness - docker compose (BUILD TỪ SOURCE của chính repo này)
#
#   1) (Khuyên làm) đặt sẵn tài khoản quản trị trong file `.env` cạnh file này:
#        JAVIS_ADMIN_USER=...   JAVIS_ADMIN_PASSWORD=...
#   2) docker compose up -d --build
#
# Vì sao build từ source mà KHÔNG kéo image dựng sẵn: các bản IDC Harness chỉ phát hành
# qua bộ cài Windows/macOS; không có image Docker chính thức của IDC Harness. Trước đây
# file này kéo image của Javis OS upstream (ghcr.io/blogminhquy/javis-os) - tức chạy code
# của dự án gốc chứ không phải bản IDC, lại tự cập nhật :latest ngoài tầm kiểm soát.
# Nay build thẳng từ Dockerfile của repo này: máy chạy đúng code anh đang đọc.
#
# CẬP NHẬT bản Docker:  git pull && docker compose up -d --build
# (Không còn Watchtower đi kèm - xem ghi chú ở cuối file.)
#
# ⚠️ BẢO MẬT: chạy public (0.0.0.0) tự BẬT JAVIS_REQUIRE_LOGIN → mở app ra là màn TẠO TÀI KHOẢN
#    / ĐĂNG NHẬP, không ai vào điều khiển agent được khi chưa có mật khẩu. Nếu không đặt sẵn
#    admin trong .env thì phải tạo tài khoản NGAY sau khi deploy: ai mở link trước sẽ tạo
#    được admin. Vào được rồi nên bật thêm 2FA.
#
# NHIỀU BẢN TRÊN CÙNG MỘT VPS: mỗi bản một thư mục riêng với .env riêng, đặt JAVIS_NAME
#   và JAVIS_HOST_PORT khác nhau là được.
# ============================================================================
services:
  javis:
    build:
      context: .
      args:
        CLAUDE_CLI_VERSION: ${CLAUDE_CLI_VERSION:-latest}
    image: idc-harness:latest
    # Tên container LẤY TỪ BIẾN, không đóng cứng: hai bản trên cùng một VPS mà cùng tên
    # container là con thứ hai chết ngay lúc `up` ("name is already in use"), kể cả khi đã chạy ở
    # thư mục khác - Docker đặt tên container theo phạm vi TOÀN MÁY chứ không theo project.
    container_name: ${JAVIS_NAME:-javis}
    restart: unless-stopped
    environment:
      # Chỉ cần nếu anh TỰ thêm Watchtower riêng (bản compose này không kèm theo nữa):
      # đặt một chuỗi ngẫu nhiên dài trong .env, app và Watchtower phải dùng chung một token.
      # Để trống thì nút "Cập nhật" trong app sẽ hướng dẫn cập nhật tay - đúng thiết kế.
      # (Trước đây mặc định sẵn "javis-update" - ai cũng biết, đã bỏ.)
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-}
      # Tài khoản quản trị đặt SẴN lúc deploy. Điền hai dòng này vào file `.env` nằm cạnh
      # compose là xong: server boot lên đã có admin, không còn khoảng trống nào.
      # Bỏ trống thì lần đầu mở app sẽ ra màn tạo tài khoản, và trên server public ai mở link
      # trước sẽ tạo được admin - phải tạo ngay sau khi deploy. Vào được rồi nên bật 2FA.
      JAVIS_ADMIN_USER: ${JAVIS_ADMIN_USER:-}
      JAVIS_ADMIN_PASSWORD: ${JAVIS_ADMIN_PASSWORD:-}
    ports:
      # Cổng MÁY CHỦ lấy từ biến (trong container vẫn luôn là 7777). Bản thứ hai đặt
      # JAVIS_HOST_PORT=6869 là hết đụng cổng. Mặc định 6868 cho thống nhất với bản
      # cài Windows/macOS.
      #
      # JAVIS_BIND = địa chỉ nghe trên máy chủ. Mặc định 0.0.0.0 (mở ra Internet, vào
      # được bằng http://<ip>:<cổng>). Chạy sau proxy chung thì đặt JAVIS_BIND=127.0.0.1 để chỉ
      # proxy vào được, còn cổng này thành lối gỡ rối qua SSH tunnel.
      #
      # Vì sao là BIẾN chứ không phải một dòng ports trong file override: compose NỐI CHỒNG danh
      # sách ports của các file -f chứ không thay thế, nên khai lại ở override là ra hai binding
      # cùng một cổng và Docker báo "port is already allocated".
      - "${JAVIS_BIND:-0.0.0.0}:${JAVIS_HOST_PORT:-6868}:7777"
    volumes:
      - javis-data:/data                       # state: settings/mật khẩu/sessions/loop (có secret → KHÔNG git)
      - javis-brains:/brains                   # MỌI second brain (kiến thức của bạn) - bền qua mọi update
      # ↑ Muốn BACKUP brain lên GitHub: đổi dòng trên thành bind-mount thư mục thật trên VPS, vd:
      #     - ./brains:/brains
      #   rồi 1 lần cấp quyền cho user non-root của container:  sudo chown -R 10001:10001 ./brains
      #   Sau đó: cd brains && git init && git add -A && git commit -m backup && git push
      - claude-auth:/home/javis/.claude        # token đăng nhập Claude (giữ qua mọi update!)
      - codex-auth:/home/javis/.codex          # token đăng nhập ChatGPT/Codex (codex login - giữ qua update)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.getenv('JAVIS_PORT','7777')+'/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # (Tùy chọn) Cloudflare Tunnel → URL HTTPS, không cần mở port:
  #   docker compose --profile tunnel up -d  &&  docker compose logs tunnel | grep trycloudflare
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ${JAVIS_NAME:-javis}-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - javis
    # `javis` ở đây là TÊN SERVICE trong compose, không phải tên container - mỗi project có mạng
    # riêng nên tên này không đụng nhau giữa các bản, giữ nguyên là đúng.
    command: tunnel --no-autoupdate --url http://javis:7777
    # URL cố định: tạo named tunnel ở Cloudflare Zero Trust → TUNNEL_TOKEN env → đổi command thành:
    #   command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}

  # Watchtower đã GỠ khỏi bản compose này (rà soát bảo mật 05/11/2026):
  #  - Nó phải mount /var/run/docker.sock = gần như quyền root trên máy chủ, chỉ để phục vụ
  #    nút "Cập nhật" 1-click.
  #  - Token gọi Watchtower trước đây có mặc định công khai "javis-update".
  #  - Quan trọng hơn: image giờ build tại chỗ, Watchtower cũng không kéo được bản mới từ
  #    registry nào cả - cập nhật đúng cách là: git pull && docker compose up -d --build.
  # Trang Cập nhật trong app tự nhận ra không có Watchtower và hướng dẫn cập nhật tay.
  # Ai thật sự cần Watchtower thì tự thêm service riêng và đặt WATCHTOWER_TOKEN ngẫu nhiên
  # dài trong .env (biến đã khai sẵn ở service javis ở trên).

volumes:
  javis-data:
  javis-brains:
  claude-auth:
  codex-auth:
